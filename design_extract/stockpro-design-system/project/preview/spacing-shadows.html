<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row" style="gap:22px;align-items:flex-end">
  <div class="sw-tile" style="align-items:center"><div style="width:96px;height:60px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04)"></div><div class="sw-name">sh</div><div class="cap" style="margin:0">resting card</div></div>
  <div class="sw-tile" style="align-items:center"><div style="width:96px;height:60px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1)"></div><div class="sw-name">sh2</div><div class="cap" style="margin:0">toast / float</div></div>
  <div class="sw-tile" style="align-items:center"><div style="width:96px;height:60px;background:#fff;border-radius:12px;box-shadow:0 12px 60px rgba(0,0,0,.18)"></div><div class="sw-name">sh-modal</div><div class="cap" style="margin:0">modal</div></div>
  <div class="sw-tile" style="align-items:center"><div style="width:96px;height:60px;background:var(--ac);border-radius:12px;box-shadow:0 4px 16px rgba(59,91,219,.35)"></div><div class="sw-name">sh-brand</div><div class="cap" style="margin:0">primary CTA glow</div></div>
</div>
<div class="cap" style="margin-top:16px">Soft, layered, low-contrast elevation. Primary CTAs get a colored glow rather than a darker drop.</div>
</body></html>
