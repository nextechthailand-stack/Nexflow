<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css">
<style>
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .13s}
.bp{background:var(--ac);color:#fff}.bs{background:var(--gn);color:#fff}
.bg2{background:var(--sur);color:var(--tx);border:1px solid var(--b2)}.brd{background:var(--rd);color:#fff}
.bsm{padding:6px 12px;font-size:12.5px}.blg{padding:13px 22px;font-size:15px;font-weight:700}
</style></head>
<body>
<div class="row">
  <button class="btn bp">บันทึก</button>
  <button class="btn bs">รับสินค้าเข้า</button>
  <button class="btn bg2">ยกเลิก</button>
  <button class="btn brd">ยกเลิกใบเสร็จ</button>
</div>
<div class="row" style="margin-top:14px;align-items:center">
  <button class="btn bp bsm">+ เพิ่มสินค้า</button>
  <button class="btn bp">Default</button>
  <button class="btn bp blg">บันทึกรับสินค้าเข้า</button>
</div>
<div class="cap" style="margin-top:14px">Primary (accent), Success (green), Ghost (white + border), Danger (red). Sizes: sm · base · lg. Hover darkens to the role's dark tone.</div>
</body></html>
