<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css">
<style>
.toast{color:#fff;border-radius:12px;padding:12px 16px;font-size:13.5px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.1);min-width:260px;margin-bottom:9px}
.ok{background:var(--gn)}.err{background:var(--rd)}.info{background:var(--ac)}
.g{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
</style></head>
<body>
<div class="toast ok"><span class="g">✓</span>บันทึกรับสินค้าเข้าเรียบร้อย</div>
<div class="toast info"><span class="g">i</span>กำลังพิมพ์ใบกำกับภาษี…</div>
<div class="toast err" style="margin:0"><span class="g">!</span>บาร์โค้ดไม่ถูกต้อง</div>
<div class="cap" style="margin-top:12px">Toasts slide up from bottom-right (slideUp .22s). Solid role color, white text, soft float shadow. Auto-dismiss.</div>
</body></html>
