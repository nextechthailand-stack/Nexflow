<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="eyebrow">Spacing — 4px base grid</div>
<div class="col" style="gap:7px">
  <div class="row" style="gap:12px"><span style="width:4px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-1 · 4px</span><span class="cap" style="margin:0">icon gaps</span></div>
  <div class="row" style="gap:12px"><span style="width:8px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-2 · 8px</span><span class="cap" style="margin:0">control gaps, chip rows</span></div>
  <div class="row" style="gap:12px"><span style="width:12px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-3 · 12px</span><span class="cap" style="margin:0">card grid gap</span></div>
  <div class="row" style="gap:12px"><span style="width:14px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-4 · 14px</span><span class="cap" style="margin:0">card padding (compact)</span></div>
  <div class="row" style="gap:12px"><span style="width:16px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-5 · 16px</span><span class="cap" style="margin:0">section gap</span></div>
  <div class="row" style="gap:12px"><span style="width:20px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-6 · 20px</span><span class="cap" style="margin:0">card body padding</span></div>
  <div class="row" style="gap:12px"><span style="width:24px;height:18px;background:var(--ac);border-radius:2px"></span><span class="mono" style="font-size:11px;width:78px">sp-7 · 24px</span><span class="cap" style="margin:0">content area padding</span></div>
</div>
</body></html>
