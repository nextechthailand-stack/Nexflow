<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css">
<style>
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
th{text-align:left;padding:9px 14px;font-size:11.5px;font-weight:700;color:var(--t2);border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:none}
.mono2{font-family:var(--font-mono);font-size:12px;color:var(--t2)}
.bx{display:inline-flex;padding:2px 9px;border-radius:100px;font-size:12px;font-weight:600}
.xg{background:var(--gbg);color:var(--gt)}.xp{background:var(--pbg);color:var(--pt)}
</style></head>
<body>
<table>
<thead><tr><th>เลขที่</th><th>วันที่</th><th>ประเภท</th><th>สินค้า</th><th>น้ำหนัก</th><th>ยอดรวม</th></tr></thead>
<tbody>
<tr><td class="mono2">INV-202505-0002</td><td>15/05/68</td><td><span class="bx xg">Wholesale</span></td><td>ปลาแซลมอนนอร์เวย์</td><td>25.500 KG</td><td style="font-weight:700">฿12,658.10</td></tr>
<tr><td class="mono2">INV-202505-0001</td><td>15/05/68</td><td><span class="bx xp">Online</span></td><td>กุ้งขาวแวนนาไม</td><td>12.000 KG</td><td style="font-weight:700">฿3,252.80</td></tr>
</tbody>
</table>
<div class="cap" style="margin-top:12px">Tables: grey header row on <span class="mono">--s2</span>, hairline dividers, hover stripe, mono codes, right-weighted money.</div>
</body></html>
