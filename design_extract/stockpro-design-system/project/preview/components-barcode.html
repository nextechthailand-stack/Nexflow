<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css">
<style>
.dot{width:7px;height:7px;border-radius:50%;background:var(--gn);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.zone{background:linear-gradient(135deg,#f0f4ff 0%,#f8fbff 100%);border:2px dashed var(--ac);border-radius:12px;padding:18px}
.bc{width:100%;padding:14px 52px 14px 18px;border:none;border-radius:8px;font-size:19px;font-family:var(--font-mono);letter-spacing:.07em;color:var(--tx);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
</style></head>
<body>
<div class="row" style="justify-content:space-between;margin-bottom:10px">
  <div style="font-size:14px;font-weight:700">สแกนบาร์โค้ดสินค้า</div>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--gn)"><span class="dot"></span>พร้อมรับสัญญาณ — เพิ่มอัตโนมัติ</div>
</div>
<div class="zone">
  <div style="position:relative">
    <input class="bc" value="1200001239094" readonly>
    <span style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:700;color:var(--gn)">✓</span>
  </div>
</div>
<div class="cap" style="margin-top:12px">The signature input: dashed-accent scan zone, 2px-feel mono field, live pulsing "ready" dot, right-aligned status glyph (✓ ok / ✕ err / ⋯ wait).</div>
</body></html>
