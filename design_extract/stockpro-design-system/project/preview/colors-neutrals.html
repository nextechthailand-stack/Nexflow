<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)">
  <div class="sw-tile"><div class="sw-box" style="background:#f0efe9"></div><div class="sw-name">bg</div><div class="sw-hex">#f0efe9</div></div>
  <div class="sw-tile"><div class="sw-box" style="background:#fff"></div><div class="sw-name">sur</div><div class="sw-hex">#ffffff</div></div>
  <div class="sw-tile"><div class="sw-box" style="background:#f7f6f2"></div><div class="sw-name">s2</div><div class="sw-hex">#f7f6f2</div></div>
  <div class="sw-tile"><div class="sw-box" style="background:#eeecea"></div><div class="sw-name">s3</div><div class="sw-hex">#eeecea</div></div>
  <div class="sw-tile"><div class="sw-box" style="background:#fff;border-color:rgba(0,0,0,.08)"></div><div class="sw-name">bd</div><div class="sw-hex">0,0,0,.08</div></div>
  <div class="sw-tile"><div class="sw-box" style="background:#fff;border:1px solid rgba(0,0,0,.14)"></div><div class="sw-name">b2</div><div class="sw-hex">0,0,0,.14</div></div>
</div>
<div class="row" style="margin-top:16px;gap:24px">
  <div class="row" style="gap:8px"><span style="width:22px;height:22px;border-radius:5px;background:#18171a;display:inline-block"></span><div><div class="sw-name">tx</div><div class="sw-hex">#18171a</div></div></div>
  <div class="row" style="gap:8px"><span style="width:22px;height:22px;border-radius:5px;background:#6a6870;display:inline-block"></span><div><div class="sw-name">t2</div><div class="sw-hex">#6a6870</div></div></div>
  <div class="row" style="gap:8px"><span style="width:22px;height:22px;border-radius:5px;background:#a09fa8;display:inline-block"></span><div><div class="sw-name">t3</div><div class="sw-hex">#a09fa8</div></div></div>
</div>
<div class="cap">Warm paper neutrals — the canvas is off-white, cards are pure white, text greys carry a warm cast.</div>
</body></html>
