<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css">
<style>
.st{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04)}
.st-l{font-size:12px;color:var(--t2);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.st-ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.st-v{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px}
.st-s{font-size:11px;color:var(--t3);margin-top:5px}
</style></head>
<body>
<div class="grid" style="grid-template-columns:repeat(3,1fr)">
  <div class="st"><div class="st-l"><span class="st-ic" style="background:var(--gbg);color:var(--gn)">฿</span>ยอดขายวันนี้</div><div class="st-v" style="color:var(--gn)">฿42,180</div><div class="st-s">+12% จากเมื่อวาน</div></div>
  <div class="st"><div class="st-l"><span class="st-ic" style="background:var(--abg);color:var(--ac)">◷</span>ตัดสต็อกวันนี้</div><div class="st-v">68.4 KG</div><div class="st-s">14 รายการ</div></div>
  <div class="st"><div class="st-l"><span class="st-ic" style="background:var(--ambg);color:var(--am)">!</span>สินค้าใกล้หมด</div><div class="st-v" style="color:var(--am)">3</div><div class="st-s">ต่ำกว่าขั้นต่ำ</div></div>
</div>
<div class="cap" style="margin-top:14px">Stat card: tiny labelled icon tile, 24px/700 value (tinted by role), faint sub-line. Used 4-up on the dashboard.</div>
</body></html>
