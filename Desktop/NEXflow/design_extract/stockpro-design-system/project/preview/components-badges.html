<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css">
<style>
.bx{display:inline-flex;padding:2px 9px;border-radius:100px;font-size:12px;font-weight:600;white-space:nowrap}
.xg{background:var(--gbg);color:var(--gt)}.xa{background:var(--ambg);color:var(--amt)}.xr{background:var(--rbg);color:var(--rt)}
.xb{background:var(--abg);color:var(--at)}.xp{background:var(--pbg);color:var(--pt)}.xx{background:var(--s2);color:var(--t2);border:1px solid var(--bd)}
.sp{display:inline-flex;padding:3px 9px;border-radius:100px;font-size:12px;font-weight:700}
.spg{background:var(--gbg);color:var(--gt)}.spa{background:var(--ambg);color:var(--amt)}.spr{background:var(--rbg);color:var(--rt)}
</style></head>
<body>
<div class="eyebrow">Badges — status & type</div>
<div class="row">
  <span class="bx xg">ชำระแล้ว</span>
  <span class="bx xb">Wholesale</span>
  <span class="bx xp">Online</span>
  <span class="bx xa">รอดำเนินการ</span>
  <span class="bx xr">ยกเลิก</span>
  <span class="bx xx">Sample</span>
</div>
<div class="eyebrow" style="margin-top:16px">Stock pills</div>
<div class="row">
  <span class="sp spg">มีสต็อก 124.5 KG</span>
  <span class="sp spa">ใกล้หมด 8.5 KG</span>
  <span class="sp spr">หมดสต็อก</span>
</div>
<div class="cap" style="margin-top:14px">Pills carry semantic meaning: green=ok/paid, amber=low/pending, red=out/void, blue=wholesale, violet=online.</div>
</body></html>
