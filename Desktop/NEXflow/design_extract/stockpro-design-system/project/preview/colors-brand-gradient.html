<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row" style="gap:18px;align-items:stretch">
  <div class="col" style="flex:1">
    <div style="height:64px;border-radius:12px;background:linear-gradient(135deg,#5b7cff,#8b5cf6)"></div>
    <div><div class="sw-name">Brand gradient</div><div class="sw-hex">linear-gradient(135deg, #5b7cff → #8b5cf6)</div></div>
  </div>
  <div class="col" style="flex:1">
    <div style="height:64px;border-radius:12px;background:linear-gradient(135deg,#1e1b4b 0%,#3b2f8a 50%,#1e3a5f 100%)"></div>
    <div><div class="sw-name">Login backdrop</div><div class="sw-hex">#1e1b4b → #3b2f8a → #1e3a5f</div></div>
  </div>
</div>
<div class="row" style="margin-top:16px;gap:16px;align-items:center">
  <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#5b7cff,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;box-shadow:0 6px 20px rgba(59,91,219,.35)">SP</div>
  <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5b7cff,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px">SP</div>
  <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5b7cff,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px">AK</div>
  <div class="cap" style="margin:0">The gradient is reserved for the logo mark, avatars, the active nav icon, and CTA glow — nothing else.</div>
</div>
</body></html>
