<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div style="display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--bd)">
  <div style="width:200px;background:#1a1826;padding:16px 14px;color:#fff">
    <div style="display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07)">
      <div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b7cff,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">SP</div>
      <div><div style="font-weight:700;font-size:13.5px">StockPro</div><div style="font-size:10px;color:rgba(255,255,255,.35)">v2.0 Premium</div></div>
    </div>
    <div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.09em;text-transform:uppercase;padding:12px 6px 6px">หลัก</div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;background:linear-gradient(90deg,rgba(91,124,255,.25),rgba(139,92,246,.15));font-size:13px;font-weight:600">
      <span style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5b7cff,#8b5cf6);display:inline-block;box-shadow:0 3px 10px rgba(91,124,255,.4)"></span>Dashboard
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;font-size:13px;color:rgba(255,255,255,.6)">
      <span style="width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.08);display:inline-block"></span>รับสินค้าเข้า
    </div>
  </div>
  <div class="col" style="flex:1;padding:16px;justify-content:center;gap:8px">
    <div class="row" style="gap:8px"><span style="width:20px;height:20px;border-radius:5px;background:#1a1826;display:inline-block"></span><span class="sw-hex">nav-bg #1a1826</span></div>
    <div class="row" style="gap:8px"><span style="width:20px;height:20px;border-radius:5px;background:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 0 0 20px rgba(255,255,255,.6)"></span><span class="sw-hex">nav-fg rgba(255,255,255,.6)</span></div>
    <div class="row" style="gap:8px"><span style="width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.07);display:inline-block"></span><span class="sw-hex">nav-line rgba(255,255,255,.07)</span></div>
    <div class="cap">Active item: gradient icon tile + glow + horizontal wash. Idle: 8%-white icon tile, 60%-white text.</div>
  </div>
</div>
</body></html>
