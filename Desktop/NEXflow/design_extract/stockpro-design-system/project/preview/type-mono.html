<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="eyebrow">Mono — codes, barcodes, tax IDs</div>
<div class="row" style="gap:10px;align-items:stretch">
  <div style="flex:1;border:2px solid var(--ac);border-radius:12px;background:#f8faff;padding:13px 16px">
    <div style="font-family:var(--font-mono);font-size:19px;letter-spacing:.07em;color:var(--tx)">1200001239094</div>
  </div>
  <div style="display:flex;align-items:center;font-size:13px;color:var(--t2)">→ code <b class="mono" style="margin:0 4px">00001</b> · <b class="mono" style="margin:0 4px">23.909 KG</b></div>
</div>
<div class="row" style="margin-top:14px;gap:24px">
  <div><div class="cap" style="margin:0 0 3px">product code</div><div class="mono" style="font-size:15px;letter-spacing:.05em">00001</div></div>
  <div><div class="cap" style="margin:0 0 3px">tax id</div><div class="mono" style="font-size:15px">0105566012345</div></div>
  <div><div class="cap" style="margin:0 0 3px">invoice no.</div><div class="mono" style="font-size:15px">INV-202505-0002</div></div>
</div>
<div class="cap" style="margin-top:14px">All machine-readable tokens use <b>Courier New</b> with letter-spacing. Barcode input: 2px accent border, large mono.</div>
</body></html>
