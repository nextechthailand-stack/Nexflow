<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row" style="gap:20px;align-items:flex-end">
  <div class="sw-tile" style="align-items:center"><div style="width:72px;height:56px;background:var(--s2);border:1px solid var(--b2);border-radius:4px"></div><div class="sw-name">r4 · 4px</div><div class="cap" style="margin:0">tiny chips</div></div>
  <div class="sw-tile" style="align-items:center"><div style="width:72px;height:56px;background:var(--s2);border:1px solid var(--b2);border-radius:8px"></div><div class="sw-name">rs · 8px</div><div class="cap" style="margin:0">buttons, inputs</div></div>
  <div class="sw-tile" style="align-items:center"><div style="width:72px;height:56px;background:var(--s2);border:1px solid var(--b2);border-radius:12px"></div><div class="sw-name">r · 12px</div><div class="cap" style="margin:0">cards, modals</div></div>
  <div class="sw-tile" style="align-items:center"><div style="width:96px;height:34px;background:var(--s2);border:1px solid var(--b2);border-radius:100px"></div><div class="sw-name">pill · 100px</div><div class="cap" style="margin:0">badges, tags</div></div>
</div>
<div class="cap" style="margin-top:16px">Three-step radius system plus full pills. Nothing sharper than 4px; nothing between 12px and full.</div>
</body></html>
